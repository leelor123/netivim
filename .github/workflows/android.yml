name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate: nothing ships unless lint, types and tests are green.
      - name: Lint, typecheck, unit tests
        run: npm run lint && npm run typecheck && npm test

      - name: E2E tests (Playwright, Android landscape emulation)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build web bundle
        run: npm run build
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}

      - uses: actions/setup-java@v5
        if: github.event_name != 'pull_request'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sync Capacitor
        if: github.event_name != 'pull_request'
        run: npx cap sync android

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
          # Monotonic, so every new APK installs over the previous one.
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (ANDROID_KEYSTORE_BASE64 etc.)"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified|Signer #1 certificate DN|SHA-256"
          mkdir -p out
          cp "$APK" out/netivim.apk
          ls -l out

      - uses: actions/upload-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          name: netivim-${{ steps.ver.outputs.version }}
          path: out/netivim.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/netivim.apk \
            --title "נתיבים $GITHUB_REF_NAME" \
            --notes "Signed Android build ${GITHUB_REF_NAME}. Download netivim.apk on the phone and install it over the previous version."

name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job gets contents: write.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact: netivim-${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate: nothing ships unless lint, types and tests are green.
      - name: Lint, typecheck, unit tests
        run: npm run lint && npm run typecheck && npm test

      - name: E2E tests (Playwright, Android landscape emulation)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build web bundle
        run: npm run build
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}

      - uses: actions/setup-java@v6
        if: github.event_name != 'pull_request'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sync Capacitor
        if: github.event_name != 'pull_request'
        run: npx cap sync android

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
          # Monotonic, so every new APK installs over the previous one.
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (ANDROID_KEYSTORE_BASE64 etc.)"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified|Signer #1 certificate DN|SHA-256"
          mkdir -p out
          cp "$APK" out/netivim.apk
          ls -l out

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: netivim-${{ steps.ver.outputs.version }}
          path: out/netivim.apk
          retention-days: 30

  # Installs the signed APK on an API 34 emulator and checks launch, landscape, immersive
  # mode, background/resume and Back. The APK is already uploaded by `build`, so on main
  # this only adds a parallel check; on tags the release job waits for it.
  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/smoke-test.sh apk/netivim.apk smoke-out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-${{ needs.build.outputs.version }}
          path: smoke-out
          if-no-files-found: warn
          retention-days: 14

  # Tags only: a broken APK is never released because this needs a green smoke test.
  release:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/netivim.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "נתיבים $GITHUB_REF_NAME" \
            --notes "Signed Android build ${GITHUB_REF_NAME}. Download netivim.apk on the phone and install it over the previous version."
